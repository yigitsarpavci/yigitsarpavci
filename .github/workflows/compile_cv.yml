name: Build and Sync CV PDF

on:
  push:
    paths:
      - 'cv/cv.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v2
        with:
          root_file: cv.tex
          working_directory: cv/
          args: -jobname=Yigit_Sarp_Avci_CV -pdf

      - name: Commit PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f cv/Yigit_Sarp_Avci_CV.pdf ]; then
            git add cv/Yigit_Sarp_Avci_CV.pdf
            git diff --cached --quiet && echo "No changes to commit" && exit 0
            git commit -m "docs: auto-generate CV PDF"
            git push origin main
          else
            echo "PDF not found"
            exit 1
          fi
